<!DOCTYPE html>
<html lang="no" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#4ade80">
  <meta name="description" content="Administrer padelturneringer offline">

  <!-- PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Padel">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="manifest" href="manifest.json">

  <title>Padel Turnering</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>

  <header class="app-header">
    <h1 class="app-title">Padel Turnering</h1>
    <button id="settings-btn" class="btn-icon" aria-label="Innstillinger" style="display:none" title="Innstillinger for turneringen">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <button id="theme-toggle" class="btn-icon" aria-label="Bytt til lys modus" title="Bytt fargetema">
      <svg id="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg id="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <main id="app-root" class="app-main">
    <div class="page" style="display:flex;align-items:center;justify-content:center;min-height:200px">
      <p style="color:var(--text-muted)">Laster...</p>
    </div>
  </main>

  <nav id="bottom-nav" class="bottom-nav">
    <!-- Populated by Router -->
  </nav>

  <!-- Shared confirm modal -->
  <dialog id="confirm-modal">
    <p id="confirm-text" class="confirm-text"></p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost">Avbryt</button>
      <button id="modal-confirm" class="btn btn-primary">Bekreft</button>
    </div>
  </dialog>

  <!-- In-tournament settings modal -->
  <dialog id="settings-modal">
    <h2 style="font-size:1rem;font-weight:700;margin-bottom:16px">Innstillinger</h2>
    <div class="form-group">
      <label class="form-label" for="settings-max-points">Makspoeng per kamp</label>
      <div class="preset-row">
        <button class="preset-btn" data-value="16">16</button>
        <button class="preset-btn" data-value="24">24</button>
        <button class="preset-btn" data-value="32">32</button>
      </div>
      <input type="number" id="settings-max-points" class="input" min="2" max="200" placeholder="Egendefinert">
    </div>
    <div class="modal-actions" style="margin-top:8px">
      <button id="settings-cancel" class="btn btn-ghost">Avbryt</button>
      <button id="settings-save" class="btn btn-primary">Lagre</button>
    </div>
  </dialog>

  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
